[project]
name = "owl-equivariance"
version = "0.1.0"
description = "Certified OWL signature-isomorphism benchmark: answer-, orbit- and proof-level equivariance auditing for LLMs."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Kept optional so the evaluation pipeline runs on a laptop with no GPU stack.
api = ["anthropic>=0.40", "openai>=1.66", "google-genai>=2.0"]
local = ["transformers>=4.44", "torch>=2.3", "accelerate>=0.33"]
# Regression analysis. Optional because the aggregate tables and permutation tests do not
# need it; only `owleq model` does.
stats = ["statsmodels>=0.14", "pandas>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "statsmodels>=0.14", "pandas>=2.0"]

[project.scripts]
owleq = "owl_equivariance.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
