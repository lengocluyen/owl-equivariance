<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="128.7mm"
     viewBox="0 0 1200 858" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Semantic-consistency evaluation through equivalent OWL presentations</title>
  <desc id="figure-desc">An illustrative subclass chain A to B to C has the entailed query A subclass of C. Two of eleven equivalent presentations are shown: renamed X to Y to Z with annotation text retained, and U to V to W with annotation text removed. Only context and query enter the generic LLM component, one variant per call. Structured responses contain a predicted label and cited axiom IDs. The certified target bypasses the model on a dashed teal path. Four symbolic tests compare predictions with the target, compare predictions across eleven variants, reasoner-check cited support for entailed queries, and compare three executions of identical input on a fixed twenty-percent base-problem sample. No model outcomes or neural architecture are depicted.</desc>
