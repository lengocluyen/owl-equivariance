stages:
  smoke:
    datasets:
      - data/certified/cl/benchmark.jsonl
      - data/certified/po/benchmark.jsonl
    max_orbits_per_dataset: 4
    primary_repeats: 1
    repeat_subset_fraction: 0.0
    extra_repeats: 0
    characters_per_token: 4.0
    input_safety_factor: 1.25
    expected_output_tokens: 192
    hard_cap_usd: 5
  discovery:
    datasets:
      - data/certified/cl/benchmark.jsonl
      - data/certified/po/benchmark.jsonl
    primary_repeats: 1
    repeat_subset_fraction: 0.0
    extra_repeats: 0
    characters_per_token: 4.0
    input_safety_factor: 1.25
    expected_output_tokens: 192
    hard_cap_usd: 250
  confirmatory:
    # Six confirmatory material sources x 200 balanced base items. The two discovery
    # ontologies are not counted in the confirmatory hypothesis tests.
    planned_base_items: 1200
    conditions: [C0, C1, C2, C3, C4, C4S2, C5, C6, C7, C8, C9]
    mean_input_tokens: 2000
    primary_repeats: 1
    repeat_subset_fraction: 0.20
    extra_repeats: 2
    input_safety_factor: 1.25
    expected_output_tokens: 192
    hard_cap_usd: 2000
