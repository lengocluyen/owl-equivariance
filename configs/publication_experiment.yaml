      role: generator_and_cost_calibration_only
    - id: po
      path: data/certified/po/benchmark.jsonl
      source: http://purl.obolibrary.org/obo/po.owl
      role: generator_and_cost_calibration_only
  confirmatory_candidates:
    - id: go
      source: http://purl.obolibrary.org/obo/go.owl
      style: OBO
      role: held_out
      screened_profile: OWL2_DL
      el_fragment_required: true
