protocol_id: owleq-jws-2026-07-v1
frozen_at: "2026-07-25"
status: "model-and-budget frozen; primary dataset panel still in capacity screening"

inference:
  prompt_style: structured_proof
  reasoning_effort: medium
  max_output_tokens: 1024
  structured_output: true
  tools: disabled
  temperature: provider_default_or_unsupported
  primary_repeats: 1

open_weight_candidate:
  provider: lmstudio
  model_family: gpt-oss
  expected_model: gpt-oss-120b
  runner: "lmstudio:<exact-id-from-preflight>"
  reasoning_effort: medium
  max_output_tokens: 1024
  status: "awaiting server preflight; exact id, revision, quantization and runtime not frozen"
  token_cost_usd: 0
  compute_budget: "record wall time, GPU-hours and energy if available"

# Prices are conservative standard synchronous rates in USD per million tokens.
# They are planning inputs, not a substitute for checking the provider invoice.
models:
  - provider: openai
    model_id: gpt-5.6-terra
    runner: openai:gpt-5.6-terra
    tier: capable
    input_usd_per_mtok: 2.50
    output_usd_per_mtok: 15.00
    stability: fixed model id
  - provider: openai
    model_id: gpt-5.6-luna
    runner: openai:gpt-5.6-luna
    tier: efficient
    input_usd_per_mtok: 1.00
    output_usd_per_mtok: 6.00
    stability: fixed model id
  - provider: anthropic
    model_id: claude-opus-4-8
    runner: anthropic:claude-opus-4-8
    tier: capable
    input_usd_per_mtok: 5.00
    output_usd_per_mtok: 25.00
    stability: pinned release id
  - provider: anthropic
    model_id: claude-sonnet-5
    runner: anthropic:claude-sonnet-5
    tier: efficient
    input_usd_per_mtok: 3.00
    output_usd_per_mtok: 15.00
    stability: pinned release id
  - provider: google
    model_id: gemini-3.6-flash
    runner: google:gemini-3.6-flash
    tier: capable
    input_usd_per_mtok: 1.50
    output_usd_per_mtok: 7.50
    stability: GA; record model_version returned by API
  - provider: google
    model_id: gemini-3.5-flash-lite
    runner: google:gemini-3.5-flash-lite
    tier: efficient
    input_usd_per_mtok: 0.30
    output_usd_per_mtok: 2.50
    stability: GA; record model_version returned by API

