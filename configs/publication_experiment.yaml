      style: OBO
      role: held_out
      screened_profile: OWL2_DL
      el_fragment_required: true
      source_file_sha256: a0b919065d33a9cf975b74cadd16c75f32f512d17f4f6d5999b74216701df54c
      source_canonical_sha256: 8904ca79e55fea8cffac303e26037715c855e2e356db771f1c82be513f820fc2
    - id: ssn
