protocol_id: owleq-jws-2026-07-v2
created_at: "2026-07-28"
status: "response-channel diagnostic and six-model discovery protocol; confirmatory data gated"
supersedes_for_open_weight_runs: owleq-jws-2026-07-v1

inference:
  provider: lmstudio
  prompt_style: structured_proof
  answer_field: content
  max_output_tokens: 1024
  request_timeout_seconds: 600
  context_length: 16384
  structured_output: json_schema_strict
  tools: disabled
  seed: 20260725
  repeat_subset_seed: 20260725
  temperature: provider_default_or_unsupported
  primary_repeats: 1
  raw_response_payload_required: true
  per_condition_max_invalid_rate: 0.02
  max_api_error_rate: 0.0

# The catalog key locates the already-installed model. The API identifier is the immutable
# alias used within this protocol. Exact artifact paths, hashes, quantization and runtime
# data are captured at execution time because they are properties of the server install.
