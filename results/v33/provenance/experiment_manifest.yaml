datasets:
  discovery:
    - id: cl
      path: data/certified/cl/benchmark.jsonl
      role: discovery_only
      base_items: 114
      conditions: [C0, C1, C2, C4, C4S2, C5, C6, C7, C8]
    - id: po
      path: data/certified/po/benchmark.jsonl
      role: discovery_only
      base_items: 90
      conditions: [C0, C1, C2, C4, C4S2, C5, C6, C7, C8]
  confirmatory:
    minimum_sources: 8
    minimum_base_items_per_source: 150
    minimum_total_base_items: 1320
    excluded_ontology_ids: [cl, po, toy]
    required_conditions: [C0, C1, C2, C3, C4, C4S2, C5, C6, C7, C8, C9]
    panel_file_required: true
    status: "blocked until an eight-source panel passes and is frozen"

analysis:
  primary:
    outcome: correct
    family: binomial
    link: logit
    implementation: lme4_glmer_laplace
    fixed_effects:
      - condition
      - task_type
      - proof_depth_z
      - context_axioms_z
      - token_delta_z
    random_intercepts:
      - ontology_id
      - ontology_id:base_item_id
    per_model_fits: true
    pooled_condition_by_model_interaction: true
    reference_condition: C0
    multiplicity: holm_within_condition_family
  response_validity:
    outcome: parsed
    otherwise_same_as_primary: true
  sensitivity:
    - estimator: gee
      cluster: ontology_id:base_item_id
      ontology: fixed_effect
    - estimator: bayes_mixed
      approximation: variational
      random_intercepts: [ontology_id, "ontology_id:base_item_id"]
  power:
    planned_base_items: 1320
    minimum_simulated_power: 0.80
    frozen_from_discovery_only: true
    posthoc_confirmatory_power_forbidden: true

