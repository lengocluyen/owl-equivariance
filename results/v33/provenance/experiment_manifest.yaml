protocol_id: owleq-jws-2026-08-v33
created_at: "2026-08-18"
status: "prospective capacity and generator-runtime amendment; confirmatory model outcomes unseen"
supersedes_for_confirmatory_runs: owleq-jws-2026-08-v32

amendment:
  basis: "capacity and design adequacy only; no confirmatory LLM outcomes inspected"
  runtime_amendment_date: "2026-08-25"
  runtime_basis: >-
    Two Uberon builds were externally terminated during deterministic source construction
    after multiple days and without producing a dataset, exit code, or LLM outcome. Kernel,
    cgroup, memory, disk, and reboot audits excluded OOM and host restart. GC provenance showed
    repeated allocation during the former linear-deletion justification implementation.
  retained_sources:
    - id: go
      observed_capacity: 162
      decision: provisional_capacity_only_rebuild_required_under_certifier_0_2_0
    - id: envo
      observed_capacity: 164
      decision: provisional_capacity_only_rebuild_required_under_certifier_0_2_0
    - id: schemaorg
      observed_capacity: 300
      decision: provisional_capacity_only_rebuild_required_under_certifier_0_2_0
  changes:
    - "replace six sources x 200 with at least eight sources x at least 150"
    - "raise the total confirmatory target from 1,200 to at least 1,320 base items"
    - "require an immutable pre-inference panel file with dataset and build-report hashes"
    - "use crossed ontology and nested-base-item random intercepts in the primary GLMM"
    - "replace linear-deletion justification with deterministic bounded QuickXplain"
    - "replace full inferred-closure materialization with seeded SHA-256 bottom-k sampling"
    - "require atomic progress checkpoints and generator diagnostics for new source builds"
    - "rebuild every confirmatory source with owl-certifier 0.2.0 before panel freeze"
  unchanged:
    - inference parameters
    - six model checkpoints and response fields
    - lexical conditions and primary contrasts
    - invalid-response handling
    - repeat-subset fraction and seed

dataset_generation:
  certifier_version: "0.2.0"
  candidate_sampling: SEEDED_SHA256_BOTTOM_K
  candidate_pool_size: "max(8 * requested_positives, 200)"
  candidate_rank: "sha256(seed + newline + canonical_query) ascending"
  justification_algorithm: QUICKXPLAIN
  justification_call_budget_per_candidate: 256
  budget_exhaustion_policy: "drop candidate and record it; never emit partial support"
  reasoner: ELK
  exact_subset_cache: true
  reuse_owl_manager_and_working_ontology: true
  fresh_reasoner_per_uncached_subset: true
  atomic_progress_checkpoint_required: true
  progress_stages_required:
    - ontology_load
    - el_fragment
    - profile_and_consistency
    - candidate_enumeration
    - justification_search
    - condition_materialization
    - context_construction
    - orbit_emission
    - artifact_write
  panel_consistency_rule: >-
    Every confirmatory source, including GO, ENVO, and Schema.org, must be regenerated and
    certified with this generator version and these parameters before the panel is frozen.

inference:
  provider: lmstudio
  prompt_style: structured_proof
  answer_field: content
  max_output_tokens: 1024
  request_timeout_seconds: 600
  context_length: 16384
  structured_output: json_schema_strict
  tools: disabled
  seed: 20260725
  repeat_subset_seed: 20260725
  temperature: provider_default_or_unsupported
  primary_repeats: 1
  raw_response_payload_required: true
  diagnostic_per_condition_max_invalid_rate: 0.05
  diagnostic_overall_max_invalid_rate: 0.01
  per_condition_max_invalid_rate: 0.02
  overall_max_invalid_rate: 0.02
  max_api_error_rate: 0.0

